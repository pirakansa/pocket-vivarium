<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eee9dd"><title>村のあしあと — こもれびの村</title>
<style>
:root{color-scheme:light;--bg:#f2eee5;--paper:#fffcf5;--ink:#324b43;--muted:#768078;--line:#dedfd2;--green:#4c8267;--amber:#bc8a35;--blue:#64889a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:1080px;margin:auto;padding:42px 28px 56px}a{color:var(--green);text-underline-offset:4px}header{display:flex;justify-content:space-between;align-items:start;gap:24px;margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--muted);margin:0 0 8px}h1{font-family:serif;font-size:32px;letter-spacing:.08em;margin:0 0 10px;font-weight:600}.intro{margin:0;font-size:14px;line-height:1.8;color:var(--muted)}header a{font-size:13px;white-space:nowrap;margin-top:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}.ranges{display:flex;padding:4px;background:#e7e6db;border-radius:10px;gap:3px}button{font:inherit;cursor:pointer;border:0;background:transparent;border-radius:7px;padding:9px 18px;color:var(--muted);font-size:13px}button[aria-pressed=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px #344b4310}button:focus-visible,svg:focus-visible{outline:3px solid var(--amber);outline-offset:3px}#status{font-size:12px;line-height:1.7;color:var(--muted)}.chart-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px 12px;margin-bottom:16px;box-shadow:0 4px 18px #324b4303}.card-head{display:flex;align-items:center;justify-content:space-between;gap:16px}h2{font-size:14px;margin:0;font-weight:600;display:flex;align-items:center;gap:9px}.dot{width:9px;height:9px;border-radius:50%;background:var(--color)}.metric{font-size:27px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.metric small{font-size:12px;color:var(--muted);margin-left:6px;letter-spacing:0}.chart{width:100%;height:190px;display:block;touch-action:pan-y;cursor:crosshair;overflow:visible}.grid{stroke:var(--line);stroke-dasharray:3 5;stroke-width:1}.axis{fill:var(--muted);font-size:11px}.series{stroke:var(--color);stroke-width:2.4;fill:none;stroke-linejoin:round}.area{fill:var(--color);opacity:.06}.cursor{stroke:var(--ink);opacity:.35;stroke-dasharray:4 3}.selected{fill:var(--color);stroke:var(--paper);stroke-width:2}.hint{font-size:12px;color:var(--muted);margin:20px 0 12px;line-height:1.8}.inspection{min-height:84px;border-left:3px solid #c4d0bd;padding:8px 16px;margin:10px 0 24px;font-size:13px;line-height:1.9}.inspection time{color:var(--muted);display:block;font-size:12px}.inspection p{margin:4px 0 0}.empty{text-align:center;color:var(--muted);padding:55px 12px;line-height:1.8}footer{font-size:11px;line-height:1.9;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}#range-label{display:block;margin-top:3px}.hidden{display:none}@media(max-width:600px){main{padding:26px 15px 36px}header{gap:10px;margin-bottom:24px}h1{font-size:25px}header a{font-size:12px}.intro{font-size:12px}.chart-card{padding:17px 13px 7px;border-radius:13px}.chart{height:175px}.metric{font-size:23px}button{padding:8px 15px}.axis{font-size:10px}#status{font-size:11px}.inspection{padding-left:12px}h2{font-size:13px}}
</style></head>
<body><main>
<header><div><p class="eyebrow">KOMOREBI VILLAGE / HISTORY</p><h1>村のあしあと</h1><p class="intro">増えたり、減ったり。村の暮らしを、少し長い目で。</p></div><a href="./">村へ戻る ↗</a></header>
<div class="toolbar"><nav class="ranges" aria-label="表示期間"><button data-days="1" aria-pressed="false">1日</button><button data-days="7" aria-pressed="false">7日</button><button data-days="30" aria-pressed="true">30日</button></nav><div id="status" role="status">記録を読み込んでいます…</div></div>
<div id="charts"></div>
<p class="hint">グラフをタップすると、その時刻の数値と、その前の5分間に起きた起動・引退を確認できます。← → キーでも移動できます。</p>
<div class="inspection" id="inspection" aria-live="polite">記録を読み込んでいます。</div>
<footer>日本時間・5分ごとの記録。未来のデータは表示しません。記録のない区間は線をつなぎません。<span id="range-label"></span></footer>
</main><script src="history.js"></script></body></html>

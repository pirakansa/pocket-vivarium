<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>こもれびの村</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f1e8;color:#293e35;font:15px system-ui,sans-serif}header,main{max-width:1280px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:5px 0}small,.muted{color:#708078}button{font:inherit;border:1px solid #c9d2c6;background:#fffdf5;color:#344e40;border-radius:9px;padding:10px 15px;cursor:pointer}button:hover{background:#e1ecdc}button.active{background:#345b47;color:white}nav{display:flex;gap:8px;flex-wrap:wrap}main{padding-top:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.scene{background:#dce8c8;border-radius:20px;overflow:hidden;border:1px solid #c6d2b9;position:relative}canvas{display:block;width:100%;aspect-ratio:1.5;cursor:pointer}.caption{position:absolute;top:18px;left:20px;font-size:13px;background:#fffdf0d9;border-radius:30px;padding:8px 14px}.panel{background:#fffdf7;border:1px solid #dedfd1;border-radius:16px;padding:20px}h2{font-size:17px;margin:0 0 15px}.controls{margin-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0}.person{text-align:left;padding:15px}.person strong{display:block;font-size:17px;margin-bottom:5px}.bar{height:5px;background:#e8e8de;border-radius:4px;margin:6px 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:#8baf79}.reason{line-height:1.8;font-size:14px}.scores{display:flex;justify-content:space-between;font-size:12px;margin-top:10px}.log{max-height:230px;overflow:auto}.log p{font-size:13px;line-height:1.6;padding:9px 0;border-bottom:1px solid #eeeee4;margin:0}.footer{font-size:12px;color:#7b8378;line-height:1.8;margin-top:14px}.tag{display:inline-block;background:#edf1e5;border-radius:6px;padding:4px 8px;font-size:12px;margin:8px 0}@media(max-width:850px){.layout{grid-template-columns:1fr}header{align-items:start;padding:18px}main{padding:0 14px 20px}.people{gap:6px}.person{padding:10px;font-size:12px}canvas{aspect-ratio:1.15}h1{font-size:22px}}
button:disabled{opacity:.45;cursor:default}.timeline{margin-top:15px;padding:16px;background:#fffdf7;border:1px solid #dedfd1;border-radius:14px}.timeline input{width:100%;accent-color:#345b47;min-height:32px}.timeline-head{display:flex;justify-content:space-between;gap:10px;font-size:13px}.controls select{font:inherit;border:1px solid #c9d2c6;border-radius:9px;padding:10px;background:#fffdf5;color:#344e40}.controls label{display:flex;align-items:center;gap:8px;font-size:13px}.caption{max-width:calc(100% - 30px);font-size:12px}@media(max-width:500px){.caption{top:10px;left:10px}.controls nav{gap:6px}button{padding:10px}}
</style><header><div><small>SMALL WORLD / OBSERVATORY 01</small><h1>こもれびの村</h1><small>小さなMEHSたちの稼働を、見守る。</small></div><span class="tag">実験中の小さな世界</span></header><main><div class="layout"><section><div class="scene"><canvas id="world" width="1000" height="660" aria-label="MEHSが行動する村。下のMEHSボタンで詳細を選べます"></canvas><div class="caption" id="clock"></div></div><div class="controls"><nav><button id="live" class="active" disabled>現在に戻る</button></nav><span class="tag" id="status" role="status">記録を読み込み中</span></div><div class="timeline"><div class="timeline-head"><span id="elapsed">過去2時間を振り返る</span><span>未来の記録は非表示</span></div><input id="seek" type="range" min="0" max="120" step="1" value="120" aria-label="過去2時間の再生位置" disabled><div class="timeline-head"><span>2時間前</span><span>1時間前</span><span>現在</span></div></div><div class="people" id="people"></div><div class="footer">MEHSを選ぶと、今の行動の理由が見られます。現在の村を表示しています。スライダーで過去2時間を振り返れます。MEHSは記録の合間も動きます。</div></section><aside><div class="panel" id="detail"></div><div class="panel" id="population" style="margin-top:16px"></div><div class="panel" id="finds" style="margin-top:16px"></div><div class="panel" style="margin-top:16px"><h2>稼働ログ</h2><div id="log" class="log"></div></div><div class="footer">現実の時刻に合わせた村の記録です。<br>更新が遅れた場合は最後の記録で待ち、MEHSの動きは続きます。</div></aside></div></main><script src="./player.js"></script><script>
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');
const places={home:[240,395],forest:[795,245],square:[525,360],hill:[735,475]};
let state=null,timeline=null,selectedId=null,running=true,last=null,animationTime=0,selectedAt=null,displayAt=0,lastState=null,lastUi=0,fetching=false,loadFailed=false;
const actions=['充電する','整備する','資源を回収する','通信する','探索する'];
const visuals=new Map();
async function loadState(){
 if(fetching)return;fetching=true;
 try{
  const response=await fetch('./state.json',{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const next=VillagePlayer.validate(await response.json());
  // Ignore an older cached response. Preserve a snapshot being reviewed even after it rolls out.
  if(!timeline||Date.parse(next.anchorAt)>=Date.parse(timeline.anchorAt))timeline=next;
  loadFailed=false;$('live').disabled=false;$('seek').disabled=false;refresh();
 }catch(error){loadFailed=true;if(!state)$('clock').textContent='記録を読み込めませんでした。自動で再試行します。';$('status').textContent='記録の取得に失敗・再試行待ち';}
 finally{fetching=false;}
}
function refresh(){
 if(!timeline)return;
 const now=Date.now(),b=VillagePlayer.bounds(timeline,now);
 displayAt=VillagePlayer.position(timeline,now,selectedAt);
 const retained=selectedAt!==null&&selectedAt<Date.parse(timeline.windowStart)&&lastState;
 const next=retained?lastState:VillagePlayer.snapshotAt(timeline,displayAt);
 if(next!==state){state=next;lastState=next;render();}
 const ago=Math.max(0,Math.floor((now-displayAt)/60000));
 $('elapsed').textContent=selectedAt===null?'現在の村':ago+'分前を表示中';
 $('status').textContent=loadFailed?'記録の取得に失敗・前回の記録を表示':b.notStarted?'記録の開始待ち':b.waiting?'更新待ち・最後の状態を表示':selectedAt===null?'LIVE · 現在':'過去の記録';
 $('live').classList.toggle('active',selectedAt===null);
 $('seek').value=selectedAt===null?120:Math.max(0,Math.min(120,120-ago));
 $('seek').setAttribute('aria-valuetext',selectedAt===null?'現在':ago+'分前');
 const date=new Date(displayAt);const clock=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(date);
 $('clock').textContent=`${clock}　 ${state.rain?'🌧 雨':'☀ 晴れ'}　 🔋 ${Number(state.food.toFixed(1))}`;
}
function motion(p,i,dt,t){
 let v=visuals.get(p.id);
 const area=p.activityArea||({'充電する':'home','整備する':'home','資源を回収する':'forest','通信する':'square','探索する':'hill'}[p.action])||'square';
 const center=places[area]||places.square;
 if(!v){v={x:p.x??center[0],y:p.y??center[1],tx:center[0],ty:center[1],wait:i*1.8,area};visuals.set(p.id,v);}
 if(v.area!==area){v.area=area;v.tx=center[0];v.ty=center[1];v.wait=0;}
 if(running){
  const distance=Math.hypot(v.tx-v.x,v.ty-v.y);
  if(distance>2){const move=Math.min(distance,dt*26*(.45+.55*(p.durability??100)/100));v.x+=(v.tx-v.x)/distance*move;v.y+=(v.ty-v.y)/distance*move;}
  else {v.wait-=dt;if(v.wait<=0){v.tx=center[0]+(Math.random()-.5)*110;v.ty=center[1]+(Math.random()-.5)*65;v.wait=2+Math.random()*5;}}
 }
 return v;
}
function renderFinds(){
 const finds=(state.finds||[]).slice(-4).reverse();
 $('finds').innerHTML=`<h2>発見の手帳</h2><span class="tag">発見した場所 ${(state.sites||[]).length}</span> <span class="tag">特別な部品 ${(state.resources?.rarePartFinds||[]).length}</span>${finds.length?finds.map(f=>`<p class="reason">✦ ${f.name}<br><small>発見 #${f.id} · MEHS #${f.finderId}${f.type==='rare-part'?' · 組み立てに利用':''}</small></p>`).join(''):'<p class="footer">回収や探索で、ときどき新しい場所や特別な部品が見つかります。</p>'}`;
}
function renderPopulation(){
 const a=state.assembly,parts=Number((state.resources?.parts||0).toFixed(1)),records=Object.values(state.lineage||{}),retired=records.filter(r=>r.retiredHour!==undefined).sort((a,b)=>b.retiredHour-a.retiredHour).slice(0,6);
 const progress=a?Math.max(0,Math.min(100,(state.hour-a.startedHour)/(a.readyHour-a.startedHour)*100)):0;
 $('population').innerHTML=`<h2>機体と継承設備</h2><span class="tag">稼働中 ${state.people.length}機</span> <span class="tag">部品 ${parts}</span>${a?`<p class="reason">${a.source==='station'?'継承設備が自動復旧中':`MEHS #${a.builderId}が組み立て中`}<br><strong>MEHS #${a.id} · 第${a.generation}世代</strong><br>設計元 ${a.parentIds.map(id=>'#'+id).join('・')||'標準設計'}${a.inspiration?`<br>✦ 発見 #${a.inspiration.id}の部品を組み込み`:''}</p><div class="bar"><i style="width:${progress}%"></i></div><small>進捗 ${Math.floor(progress)}% · 起動まで約${Math.max(0,Math.ceil((a.readyHour-state.hour)*60))}分</small>`:'<p class="footer">電力セルと部品に余裕があると、機体の性格に応じて新しい機体の組み立てを始めます。</p>'}${retired.length?'<h2 style="margin-top:18px">設計を残した機体</h2>'+retired.map(r=>`<p class="footer">MEHS #${r.id} · 第${r.generation}世代<br>稼働 ${Math.floor((r.retiredHour-r.activatedHour)/24)}日 · 部品を継承</p>`).join(''):''}`;
}
function render(){renderPopulation();renderFinds();if(!state.people.some(p=>p.id===selectedId))selectedId=state.people[0]?.id;if(!state.people.length){$('people').innerHTML='';$('detail').textContent=state.assembly?'機体は現在0機です。継承設備が次のMEHSを組み立てています。':'MEHSはまだいません。';$('log').innerHTML=state.logs.map(t=>`<p>${t}</p>`).join('');return;}$('people').innerHTML=state.people.map((p,i)=>`<button class="person ${selectedId===p.id?'active':''}" onclick="select(${p.id})"><strong>● MEHS #${p.id}</strong>${p.trait}<br><small>第${p.generation||1}世代</small><br><span style="display:block;margin-top:10px">${p.action}</span></button>`).join('');const p=state.people.find(p=>p.id===selectedId);$('detail').innerHTML=`<small>いま、何を判断している？</small><h2 style="margin-top:10px">MEHS #${p.id}の稼働記録</h2><span class="tag">${p.trait}</span><p class="footer">第${p.generation||1}世代 · 起動から${Math.floor(Math.max(0,state.hour-(p.activatedHour??state.hour))/24)}日<br>継承元：${p.parentIds?.length?p.parentIds.map(id=>'#'+id).join('・'):'初期設計'}<br>経年耐久 ${Math.round(p.durability??100)} / 100<br>累積摩耗 ${Number((p.wearHours??0).toFixed(1))}時間相当（雨による追加 ${Number((p.rainWearHours??0).toFixed(1))}時間）<br>仕様：${p.variant||'継承設計'}${p.inspiration?`<br>発見 #${p.inspiration.id}（MEHS #${p.inspiration.finderId}の部品）を継承`:''}</p><p class="reason">「${p.reason}」</p>${[['充電不足',p.hunger],['機体コンディション',p.energy],['通信欲求',p.social]].map(([l,v])=>`${l} <small>${Math.round(v)} / 100</small><div class="bar"><i style="width:${v}%"></i></div>`).join('')}${p.scores?.length?'<small>今回の優先度（行動前）</small>':''}${(p.scores||[]).slice(0,3).map(c=>`<div class="scores"><span>${actions[c.a]}</span><b>${Math.max(0,Math.round(c.s))}</b></div>`).join('')}<p class="footer">経験：資源回収 ${p.success} / 探索 ${p.discoveries} / 通信 ${p.kindness}<br>回収に成功すると、その経験が次の選択を後押しします。</p>`;$('log').innerHTML=state.logs.map(t=>`<p>${t}</p>`).join('')}
function select(id){selectedId=id;render()}
function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function tree(x,y,s=1){ctx.fillStyle='#827254';ctx.fillRect(x-5*s,y-10*s,10*s,48*s);ellipse(x,y-27*s,29*s,38*s,'#78995f');ellipse(x-15*s,y-13*s,24*s,25*s,'#86a969');ellipse(x+18*s,y-16*s,25*s,29*s,'#729359')}
function house(x,y){ctx.fillStyle='#a7b7ac';ctx.beginPath();ctx.roundRect(x-64,y-62,128,108,12);ctx.fill();ctx.fillStyle='#536c64';ctx.fillRect(x-72,y-62,144,14);ctx.fillStyle='#dcebdc';ctx.fillRect(x-49,y-35,98,61);ctx.fillStyle='#6d9385';ctx.fillRect(x-18,y-10,36,55);ctx.fillStyle='#87edc7';ctx.beginPath();ctx.moveTo(x+6,y-42);ctx.lineTo(x-11,y-20);ctx.lineTo(x+1,y-20);ctx.lineTo(x-5,y-1);ctx.lineTo(x+17,y-27);ctx.lineTo(x+5,y-27);ctx.fill();ctx.fillStyle='#557468';ctx.font='bold 11px system-ui';ctx.fillText('MEHS / CHARGE',x,y-76);}
function robot(p,t,i){
 const moving=Math.hypot(p.tx-p.x,p.ty-p.y)>5,bob=moving?Math.sin(t/130+i)*2:Math.sin(t/650+i)*.8,x=p.x,y=p.y+bob;
 ellipse(x,p.y+16,19,6,'#51634b25');
 if(selectedId===p.id){ctx.strokeStyle='#fafcf0';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,p.y+15,25,11,0,0,7);ctx.stroke();}
 ctx.fillStyle='#40534e';ctx.beginPath();ctx.roundRect(x-17,y+5,34,12,6);ctx.fill();
 ctx.fillStyle=p.color;ctx.beginPath();ctx.roundRect(x-18,y-17,36,30,8);ctx.fill();
 ctx.fillStyle='#e4ede6';ctx.beginPath();ctx.roundRect(x-22,y-43,44,29,9);ctx.fill();
 ctx.fillStyle='#263f3e';ctx.beginPath();ctx.roundRect(x-17,y-38,34,18,5);ctx.fill();
 ctx.fillStyle='#8cf0d1';const blink=Math.sin(t/1700+i)>0.995;
 if(p.eyeShape==='visor'){ctx.fillRect(x-12,y-31,24,blink?2:5);}
 else if(p.eyeShape==='round'&&!blink){ellipse(x-8,y-29,4,4,'#8cf0d1');ellipse(x+8,y-29,4,4,'#8cf0d1');}
 else{ctx.fillRect(x-11,y-32,6,blink?2:5);ctx.fillRect(x+5,y-32,6,blink?2:5);}
 if(p.lastEvent&&p.lastEvent.untilHour>state.hour){ctx.fillStyle='#bd9345';ctx.font='bold 14px system-ui';ctx.fillText('✦',x+30,y-44);}
 ctx.strokeStyle='#688e7c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y-43);ctx.lineTo(x,y-52);ctx.stroke();ellipse(x,y-54,4,4,'#8cf0d1');
 ctx.fillStyle='#344c45';ctx.fillRect(x-24,y-12,5,15);ctx.fillRect(x+19,y-12,5,15);
 ctx.fillStyle='#eff8ec';ctx.font='bold 11px system-ui';ctx.fillText('M',x,y+4);
 ctx.fillStyle='#344537';ctx.font='bold 14px system-ui';ctx.fillText(`MEHS #${p.id}`,x,y-65);ctx.font='12px system-ui';ctx.fillText(p.action,x,y+34);if((p.durability??100)<20){ctx.fillStyle='#bc8150';ctx.font='12px system-ui';ctx.fillText('経年劣化',x,y+49);}
}
function draw(timestamp){const elapsed=last===null||document.hidden?0:Math.max(0,(timestamp-last)/1000);last=timestamp;const dt=Math.min(elapsed,.1);if(!document.hidden){animationTime+=dt*1000;if(timestamp-lastUi>=1000){lastUi=timestamp;refresh();}}const t=animationTime;ctx.fillStyle='#dbe8c7';ctx.fillRect(0,0,1000,660);ellipse(850,60,330,170,'#c4d7ae');ellipse(70,30,320,145,'#cbdcb4');ctx.strokeStyle='#ece3c8';ctx.lineWidth=45;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(240,405);ctx.quadraticCurveTo(490,330,790,250);ctx.moveTo(510,360);ctx.lineTo(735,480);ctx.stroke();ctx.fillStyle='#a8cbd0';ctx.beginPath();ctx.moveTo(0,520);ctx.bezierCurveTo(300,480,400,650,1000,570);ctx.lineTo(1000,660);ctx.lineTo(0,660);ctx.fill();ctx.strokeStyle='#8ebac1';ctx.lineWidth=2;for(let i=0;i<10;i++){ctx.beginPath();ctx.moveTo(i*110+Math.sin(t/1800+i)*8,610);ctx.lineTo(i*110+38,610);ctx.stroke()}
for(const [x,y,s] of [[90,170,1.2],[160,140,1],[870,170,1.2],[925,220,1],[785,140,1.1],[865,295,.8],[95,430,.8],[420,170,.7]])tree(x,y,s);house(235,360);ellipse(525,360,55,30,'#c7c9a8');ellipse(525,350,20,12,'#a5b9ad');ctx.fillStyle='#8f9b82';ctx.fillRect(516,332,18,20);ellipse(525,330,25,9,'#b4c3b3');ctx.font='18px system-ui';ctx.fillStyle='#53684b';ctx.textAlign='center';ctx.fillText('充電ステーション',235,440);ctx.fillText('広場',525,410);ctx.fillText('資源の林',800,335);ctx.fillText('見晴らしの丘',750,535);for(let i=0;i<35;i++){let x=(i*137)%970,y=180+(i*71)%350;ellipse(x,y,2,2,i%2?'#f5e9ab':'#a9bd8b')}
if(state?.sites?.length){ctx.fillStyle='#8b7842';ctx.font='12px system-ui';ctx.fillText(`✦ 発見した場所 ${state.sites.length}`,760,565);}
if(state?.assembly){ctx.fillStyle='#d5a34c';ctx.font='bold 14px system-ui';ctx.fillText(`⚙ #${state.assembly.id} 組み立て中`,235,485);}
if(state)state.people.forEach((person,i)=>{const v=motion(person,i,dt,t);robot({...person,...v},t,i)});
const h=state?state.hour%24:12;if(h>=20||h<6){ctx.fillStyle='#1b345b40';ctx.fillRect(0,0,1000,660)}if(state&&state.rain){ctx.strokeStyle='#6e94a966';ctx.lineWidth=2;for(let i=0;i<65;i++){let x=(i*59+t/15)%1000,y=(i*83+t/3)%660;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-6,y+16);ctx.stroke()}}requestAnimationFrame(draw)}
$('live').onclick=()=>{selectedAt=null;visuals.clear();lastState=null;refresh();};
$('seek').oninput=()=>{if(!timeline)return;const now=Date.now(),value=Number($('seek').value);selectedAt=value>=120?null:Math.max(Date.parse(timeline.windowStart),now-(120-value)*60000);visuals.clear();lastState=null;refresh();};
canvas.onclick=e=>{if(!state)return;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*1000/r.width,y=(e.clientY-r.top)*660/r.height;let i=state.people.findIndex(p=>{const v=visuals.get(p.id);return v&&Math.hypot(v.x-x,v.y-y)<40});if(i>=0)select(state.people[i].id)};
document.addEventListener('visibilitychange',()=>{last=null;if(!document.hidden){refresh();loadState();}});
loadState();setInterval(()=>{if(!document.hidden)loadState()},60000);requestAnimationFrame(draw);
</script></html>

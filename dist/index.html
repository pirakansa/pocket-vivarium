<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>こもれびの村</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f1e8;color:#293e35;font:15px system-ui,sans-serif}header,main{max-width:1280px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:5px 0}small,.muted{color:#708078}button{font:inherit;border:1px solid #c9d2c6;background:#fffdf5;color:#344e40;border-radius:9px;padding:10px 15px;cursor:pointer}button:hover{background:#e1ecdc}button.active{background:#345b47;color:white}nav{display:flex;gap:8px;flex-wrap:wrap}main{padding-top:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.scene{background:#dce8c8;border-radius:20px;overflow:hidden;border:1px solid #c6d2b9;position:relative}canvas{display:block;width:100%;aspect-ratio:1.5;cursor:pointer}.caption{position:absolute;top:18px;left:20px;font-size:13px;background:#fffdf0d9;border-radius:30px;padding:8px 14px}.panel{background:#fffdf7;border:1px solid #dedfd1;border-radius:16px;padding:20px}h2{font-size:17px;margin:0 0 15px}.controls{margin-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.people{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.person{text-align:left;padding:15px}.person strong{display:block;font-size:17px;margin-bottom:5px}.bar{height:5px;background:#e8e8de;border-radius:4px;margin:6px 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:#8baf79}.reason{line-height:1.8;font-size:14px}.scores{display:flex;justify-content:space-between;font-size:12px;margin-top:10px}.log{max-height:230px;overflow:auto}.log p{font-size:13px;line-height:1.6;padding:9px 0;border-bottom:1px solid #eeeee4;margin:0}.footer{font-size:12px;color:#7b8378;line-height:1.8;margin-top:14px}.tag{display:inline-block;background:#edf1e5;border-radius:6px;padding:4px 8px;font-size:12px;margin:8px 0}@media(max-width:850px){.layout{grid-template-columns:1fr}header{align-items:start;padding:18px}main{padding:0 14px 20px}.people{gap:6px}.person{padding:10px;font-size:12px}canvas{aspect-ratio:1.15}h1{font-size:22px}}
</style><header><div><small>SMALL WORLD / OBSERVATORY 01</small><h1>こもれびの村</h1><small>小さな暮らしを、少しだけ見守る。</small></div><span class="tag">実験中の小さな世界</span></header><main><div class="layout"><section><div class="scene"><canvas id="world" width="1000" height="660" aria-label="住人が行動する村。下の住人ボタンで詳細を選べます"></canvas><div class="caption" id="clock"></div></div><div class="controls"><nav><button id="play" class="active">Ⅱ 一時停止</button><button id="step">1時間進める</button><button id="speed">速度 ×1</button></nav><nav><button id="food">🍎 食料を補充</button><button id="rain">☁ 雨を降らせる</button></nav></div><div class="people" id="people"></div><div class="footer">住人を選ぶと、今の行動の理由が見られます。村はこの画面を開いている間に進み、自動保存されます。</div></section><aside><div class="panel" id="detail"></div><div class="panel" style="margin-top:16px"><h2>村の手帳</h2><div id="log" class="log"></div></div><div class="footer">性格 × 欲求 × 記憶で行動を選ぶ、ルールベースの試作品です。<br>食料不足や雨で、選択の変化を観察できます。</div><button id="reset" style="margin-top:14px;font-size:12px">村を最初からやり直す</button></aside></div></main><script>
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');
const places={home:[240,395],forest:[795,245],square:[525,360],hill:[735,475]};
let state,selected=0,running=true,speed=1,acc=0,last=0;const actions=['食べる','休む','採集する','交流する','探検する'];
function fresh(){return {hour:8,food:9,rain:0,logs:['小さな村で、3人の暮らしが始まりました。'],people:[{name:'ハル',trait:'慎重で備え好き',color:'#c38450',hunger:25,energy:85,social:30,curiosity:20,care:1,safe:3,adventure:0.7},{name:'ユイ',trait:'仲間を気にかける',color:'#b76a79',hunger:40,energy:75,social:60,curiosity:30,care:3,safe:1,adventure:1},{name:'レン',trait:'知らない場所が好き',color:'#597eab',hunger:20,energy:90,social:20,curiosity:75,care:0.8,safe:0.8,adventure:3}].map((p,i)=>({...p,x:460+i*55,y:380,tx:460+i*55,ty:380,action:'散歩する',reason:'朝の村を歩いています。',success:0,discoveries:0,kindness:0}))}}
try{state=JSON.parse(localStorage.getItem('komorebi-v1'))||fresh()}catch{state=fresh()}
function log(t){state.logs.unshift(t);state.logs=state.logs.slice(0,35)}function save(){try{localStorage.setItem('komorebi-v1',JSON.stringify(state))}catch{}}
function tick(){state.hour++;if(state.rain>0)state.rain--;for(const p of state.people){p.hunger=Math.min(100,p.hunger+7);p.energy=Math.max(0,p.energy-4);p.social=Math.min(100,p.social+5);p.curiosity=Math.min(100,p.curiosity+4);const tired=100-p.energy,short=Math.max(0,9-state.food);let choices=[{a:0,s:state.food>0?p.hunger*1.3:-1,why:`空腹が${Math.round(p.hunger)}。まず食事をしたい。`,to:'home'},{a:1,s:tired*1.1+(state.hour%24>=21||state.hour%24<6?25:0),why:'疲れがたまってきたので、家でひと休み。',to:'home'},{a:2,s:short*7*p.safe+15+p.success*2-(state.rain?22:0)-tired*.3,why:state.food<6?'村の食料が少ない。備えを増やしておきたい。':'前にうまく採れた場所を、もう一度探したい。',to:'forest'},{a:3,s:p.social*p.care*.65+(state.people.some(q=>q!==p&&q.energy<35)?22*p.care:0),why:'誰かと過ごしたい。仲間の様子も気になる。',to:'square'},{a:4,s:p.curiosity*p.adventure*.45-tired*.5-(state.rain?35:0),why:'丘の向こうに、まだ知らない場所がありそう。',to:'hill'}];choices.sort((a,b)=>b.s-a.s);const c=choices[0];p.scores=choices;p.action=actions[c.a];p.reason=c.why;p.tx=places[c.to][0]+(Math.random()-.5)*65;p.ty=places[c.to][1]+(Math.random()-.5)*40;
if(c.a===0){state.food--;p.hunger=Math.max(0,p.hunger-60)}if(c.a===1)p.energy=Math.min(100,p.energy+40);if(c.a===2){const n=state.rain?1:2;state.food+=n;p.energy=Math.max(0,p.energy-10);p.success=Math.min(8,p.success+1);log(`${p.name}が森で食料を${n}個集めた。`)}if(c.a===3){p.social=Math.max(0,p.social-60);let q=state.people.filter(q=>q!==p).sort((a,b)=>a.energy-b.energy)[0];q.energy=Math.min(100,q.energy+8);p.kindness++;log(`${p.name}が${q.name}と話し、元気づけた。`)}if(c.a===4){p.curiosity=0;p.energy=Math.max(0,p.energy-16);p.discoveries++;if(p.discoveries%3===0){state.food+=3;log(`${p.name}が丘で木の実の茂みを発見！ 食料 +3`)}else log(`${p.name}が丘の向こうを探検した。`)} }
save();render()}
function render(){$('clock').textContent=`${Math.floor(state.hour/24)+1}日目 · ${String(state.hour%24).padStart(2,'0')}:00　 ${state.rain?'🌧 雨':'☀ 晴れ'}　 🍎 ${state.food}`;$('people').innerHTML=state.people.map((p,i)=>`<button class="person ${selected===i?'active':''}" onclick="select(${i})"><strong>● ${p.name}</strong>${p.trait}<br><span style="display:block;margin-top:10px">${p.action}</span></button>`).join('');const p=state.people[selected];$('detail').innerHTML=`<small>いま、何を考えている？</small><h2 style="margin-top:10px">${p.name}の小さな日常</h2><span class="tag">${p.trait}</span><p class="reason">「${p.reason}」</p>${[['空腹',p.hunger],['体力',p.energy],['交流したさ',p.social]].map(([l,v])=>`${l} <small>${Math.round(v)} / 100</small><div class="bar"><i style="width:${v}%"></i></div>`).join('')}<small>今回の優先度（行動前）</small>${(p.scores||[]).slice(0,3).map(c=>`<div class="scores"><span>${actions[c.a]}</span><b>${Math.max(0,Math.round(c.s))}</b></div>`).join('')}<p class="footer">経験：採集 ${p.success} / 探検 ${p.discoveries} / 交流 ${p.kindness}<br>採集に成功すると、その経験が次の選択を後押しします。</p>`;$('log').innerHTML=state.logs.map(t=>`<p>${t}</p>`).join('')}
function select(i){selected=i;render()}
function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function tree(x,y,s=1){ctx.fillStyle='#827254';ctx.fillRect(x-5*s,y-10*s,10*s,48*s);ellipse(x,y-27*s,29*s,38*s,'#78995f');ellipse(x-15*s,y-13*s,24*s,25*s,'#86a969');ellipse(x+18*s,y-16*s,25*s,29*s,'#729359')}
function house(x,y){ctx.fillStyle='#eee1b9';ctx.fillRect(x-60,y-40,120,85);ctx.fillStyle='#ab7759';ctx.beginPath();ctx.moveTo(x-77,y-38);ctx.lineTo(x,y-103);ctx.lineTo(x+77,y-38);ctx.fill();ctx.fillStyle='#6e7057';ctx.fillRect(x-12,y+5,25,40);ctx.fillStyle='#9ec8bd';ctx.fillRect(x-42,y-15,22,23);ctx.fillRect(x+23,y-15,22,23)}
function draw(t){const dt=Math.min((t-last)/1000,.1)||0;last=t;if(running){acc+=dt*speed;if(acc>=3){acc=0;tick()}}ctx.fillStyle='#dbe8c7';ctx.fillRect(0,0,1000,660);ellipse(850,60,330,170,'#c4d7ae');ellipse(70,30,320,145,'#cbdcb4');ctx.strokeStyle='#ece3c8';ctx.lineWidth=45;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(240,405);ctx.quadraticCurveTo(490,330,790,250);ctx.moveTo(510,360);ctx.lineTo(735,480);ctx.stroke();ctx.fillStyle='#a8cbd0';ctx.beginPath();ctx.moveTo(0,520);ctx.bezierCurveTo(300,480,400,650,1000,570);ctx.lineTo(1000,660);ctx.lineTo(0,660);ctx.fill();ctx.strokeStyle='#8ebac1';ctx.lineWidth=2;for(let i=0;i<10;i++){ctx.beginPath();ctx.moveTo(i*110+Math.sin(t/1800+i)*8,610);ctx.lineTo(i*110+38,610);ctx.stroke()}
for(const [x,y,s] of [[90,170,1.2],[160,140,1],[870,170,1.2],[925,220,1],[785,140,1.1],[865,295,.8],[95,430,.8],[420,170,.7]])tree(x,y,s);house(235,360);ellipse(525,360,55,30,'#c7c9a8');ellipse(525,350,20,12,'#a5b9ad');ctx.fillStyle='#8f9b82';ctx.fillRect(516,332,18,20);ellipse(525,330,25,9,'#b4c3b3');ctx.font='18px system-ui';ctx.fillStyle='#53684b';ctx.textAlign='center';ctx.fillText('家',235,440);ctx.fillText('広場',525,410);ctx.fillText('木の実の森',800,335);ctx.fillText('見晴らしの丘',750,535);for(let i=0;i<35;i++){let x=(i*137)%970,y=180+(i*71)%350;ellipse(x,y,2,2,i%2?'#f5e9ab':'#a9bd8b')}
state.people.forEach((p,i)=>{p.x+=(p.tx-p.x)*Math.min(1,dt*1.4);p.y+=(p.ty-p.y)*Math.min(1,dt*1.4);const bob=Math.hypot(p.tx-p.x,p.ty-p.y)>5?Math.sin(t/130+i)*3:Math.sin(t/700+i);ellipse(p.x,p.y+14,15,6,'#51634b25');if(selected===i){ctx.strokeStyle='#fafcf0';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(p.x,p.y+13,22,10,0,0,7);ctx.stroke()}ctx.fillStyle=p.color;ctx.beginPath();ctx.roundRect(p.x-11,p.y-10+bob,22,26,8);ctx.fill();ellipse(p.x,p.y-18+bob,10,11,'#f2d6ad');ellipse(p.x-2,p.y-25+bob,11,6,'#655342');ctx.fillStyle='#344537';ctx.font='bold 16px system-ui';ctx.fillText(p.name,p.x,p.y-40+bob);ctx.font='12px system-ui';ctx.fillText(p.action,p.x,p.y+34)});
const h=state.hour%24;if(h>=20||h<6){ctx.fillStyle='#1b345b40';ctx.fillRect(0,0,1000,660)}if(state.rain){ctx.strokeStyle='#6e94a966';ctx.lineWidth=2;for(let i=0;i<65;i++){let x=(i*59+t/15)%1000,y=(i*83+t/3)%660;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-6,y+16);ctx.stroke()}}requestAnimationFrame(draw)}
$('play').onclick=()=>{running=!running;$('play').textContent=running?'Ⅱ 一時停止':'▶ 再開';$('play').classList.toggle('active',running)};$('step').onclick=()=>{acc=0;tick()};$('speed').onclick=()=>{speed=speed===1?3:speed===3?10:1;$('speed').textContent='速度 ×'+speed};$('food').onclick=()=>{state.food+=8;log('空から食料が届いた。食料 +8');save();render()};$('rain').onclick=()=>{state.rain=state.rain?0:8;log(state.rain?'村に雨が降り始めた。外出の優先度が下がる。':'雨がやみ、空が明るくなった。');save();render()};$('reset').onclick=()=>{if(confirm('村の記録を消し、初日から始めますか？')){state=fresh();acc=0;save();render()}};canvas.onclick=e=>{let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*1000/r.width,y=(e.clientY-r.top)*660/r.height;let i=state.people.findIndex(p=>Math.hypot(p.x-x,p.y-y)<40);if(i>=0)select(i)};document.addEventListener('visibilitychange',()=>{last=performance.now();acc=0});render();requestAnimationFrame(draw);
</script></html>

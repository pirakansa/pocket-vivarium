</style></head><body><header><div class="brand"><div class="brand-mark" aria-hidden="true">✦</div><div><div class="eyebrow">POCKET VIVARIUM</div><h1>こもれびの村</h1></div></div><span class="subtitle">今日も、ちいさな発見を。</span><details class="guide"><summary aria-label="遊び方">?</summary><p>MEHSたちは、自分で考えて暮らしています。<br>機体をタップして、いまの気持ちをのぞいてみましょう。<br><br>時計を開くと、過去2時間の出来事を振り返れます。</p></details></header><main><div class="layout"><section><div class="scene"><canvas id="world" width="1000" height="660" aria-label="MEHSたちの小さな村。機体をタップして観察できます"></canvas><div class="map-top"><div class="map-sign"><b>✦ こもれびの小径</b><small>MEHS FIELD / 01</small></div><div class="caption" id="clock">村につないでいます…</div></div><div class="hud" id="hud"></div><span class="map-tip">機体をタップして観察</span></div><div class="watchbar"><span class="watch-label">MEHSたち</span><span class="tag" id="status" role="status">記録を読み込み中</span><button id="live" class="live-button active" disabled>現在に戻る</button></div><div class="people" id="people"></div><details class="time-travel"><summary><span>◷ 時間をさかのぼる</span><span id="elapsed">現在の村</span></summary><div class="timeline"><input id="seek" type="range" min="0" max="120" step="1" value="120" aria-label="過去2時間の再生位置" disabled><div class="timeline-head"><span>2時間前</span><span>1時間前</span><span>現在</span></div></div></details></section><aside class="field-guide"><div class="guide-top"><b>観察ノート</b><small>FIELD NOTES</small></div><nav class="tabs" aria-label="観察ノート"><button id="tab-detail" class="active" onclick="showTab('detail')" aria-pressed="true">機体</button><button id="tab-world" onclick="showTab('world')" aria-pressed="false">工房</button><button id="tab-story" onclick="showTab('story')" aria-pressed="false">できごと</button></nav><div id="view-detail" class="tab-content"><div class="panel" id="detail"></div></div><div id="view-world" class="tab-content" hidden><div class="panel" id="population"></div></div><div id="view-story" class="tab-content" hidden><div class="panel" id="finds"></div><div class="section-label">VILLAGE DIARY</div><div id="log" class="log"></div></div></aside></div><p class="world-note">ちいさな機体がつなぐ、ゆっくりとした世界。</p></main><script src="./player.js"></script><script>
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');
const places={home:[240,395],forest:[795,245],square:[525,360],hill:[735,475]};
let state=null,timeline=null,selectedId=null,running=true,last=null,animationTime=0,selectedAt=null,displayAt=0,lastState=null,lastUi=0,fetching=false,loadFailed=false;
const actions=['充電する','整備する','資源を回収する','通信する','探索する'];
const visuals=new Map();
async function loadState(){
 if(fetching)return;fetching=true;
 try{
  const response=await fetch('./state.json',{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const next=VillagePlayer.validate(await response.json());
  // Ignore an older cached response. Preserve a snapshot being reviewed even after it rolls out.
  if(!timeline||Date.parse(next.anchorAt)>=Date.parse(timeline.anchorAt))timeline=next;
  loadFailed=false;$('live').disabled=false;$('seek').disabled=false;refresh();
 }catch(error){loadFailed=true;if(!state)$('clock').textContent='記録を読み込めませんでした。自動で再試行します。';$('status').textContent='記録の取得に失敗・再試行待ち';}
 finally{fetching=false;}
}
function refresh(){
 if(!timeline)return;
 const now=Date.now(),b=VillagePlayer.bounds(timeline,now);
 displayAt=VillagePlayer.position(timeline,now,selectedAt);
 const retained=selectedAt!==null&&selectedAt<Date.parse(timeline.windowStart)&&lastState;
 const next=retained?lastState:VillagePlayer.snapshotAt(timeline,displayAt);
 if(next!==state){state=next;lastState=next;render();}
 const ago=Math.max(0,Math.floor((now-displayAt)/60000));
 $('elapsed').textContent=selectedAt===null?'現在の村':ago+'分前を表示中';
 $('status').textContent=loadFailed?'記録の取得に失敗・前回の記録を表示':b.notStarted?'記録の開始待ち':b.waiting?'更新待ち・最後の状態を表示':selectedAt===null?'LIVE · 現在':'過去の記録';
 $('live').classList.toggle('active',selectedAt===null);
 $('seek').value=selectedAt===null?120:Math.max(0,Math.min(120,120-ago));
 $('seek').setAttribute('aria-valuetext',selectedAt===null?'現在':ago+'分前');
 const date=new Date(displayAt);const clock=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(date);
 $('clock').textContent=`${state.rain?'☂':'☀'} ${clock} · ${state.rain?'雨':'晴れ'}`;
}
function motion(p,i,dt,t){
 let v=visuals.get(p.id);
 const area=p.activityArea||({'充電する':'home','整備する':'home','資源を回収する':'forest','通信する':'square','探索する':'hill'}[p.action])||'square';
 const center=places[area]||places.square;
 if(!v){v={x:p.x??center[0]+Math.cos(p.id*2.4)*40,y:p.y??center[1]+Math.sin(p.id*2.4)*24,tx:center[0]+Math.cos(p.id*2.4)*40,ty:center[1]+Math.sin(p.id*2.4)*24,wait:i*1.8,area};visuals.set(p.id,v);}
 if(v.area!==area){v.area=area;v.tx=center[0];v.ty=center[1];v.wait=0;}
 if(running){
  const distance=Math.hypot(v.tx-v.x,v.ty-v.y);
  if(distance>2){const move=Math.min(distance,dt*26*(.45+.55*(p.durability??100)/100));v.x+=(v.tx-v.x)/distance*move;v.y+=(v.ty-v.y)/distance*move;}
  else {v.wait-=dt;if(v.wait<=0){v.tx=center[0]+(Math.random()-.5)*110;v.ty=center[1]+(Math.random()-.5)*65;v.wait=2+Math.random()*5;}}
 }
 return v;
}
function avatar(p){
 const color=p.color||'#709e91';
 const eyes=p.eyeShape==='visor'?'<rect x="35" y="37" width="30" height="6" rx="3"/>':p.eyeShape==='round'?'<circle cx="40" cy="40" r="4"/><circle cx="60" cy="40" r="4"/>':'<rect x="36" y="37" width="7" height="7" rx="1"/><rect x="57" y="37" width="7" height="7" rx="1"/>';
 return `<svg viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="88" rx="25" ry="6" fill="#465e3c18"/><path d="M50 23V12" stroke="#657a68" stroke-width="4"/><circle cx="50" cy="10" r="5" fill="#9dd2a0"/><rect x="28" y="72" width="44" height="16" rx="8" fill="#43544d"/><rect x="29" y="52" width="42" height="29" rx="9" fill="${color}"/><rect x="21" y="24" width="58" height="34" rx="12" fill="#edf0db" stroke="#bac7ad" stroke-width="2"/><rect x="28" y="31" width="44" height="20" rx="7" fill="#344d48"/><g fill="#a5f0ce">${eyes}</g><rect x="21" y="59" width="6" height="17" rx="3" fill="#65776a"/><rect x="73" y="59" width="6" height="17" rx="3" fill="#65776a"/><text x="50" y="72" text-anchor="middle" font-size="12" font-family="system-ui" font-weight="800" fill="#fff8df">M</text></svg>`;
}
function showTab(name){for(const key of ['detail','world','story']){$('view-'+key).hidden=key!==name;$('tab-'+key).classList.toggle('active',key===name);$('tab-'+key).setAttribute('aria-pressed',String(key===name));}}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function programCard(p){return p.program?`<details class="details"><summary>⌘ ${escapeHtml(p.program.name)}</summary><p class="footer">作成 #${p.program.authorId}${p.program.receivedFrom?' · 共有元 #'+p.program.receivedFrom:''}<br>実行 ${p.program.runs}回 · 行動に使用 ${p.program.used||0}回</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:10px;line-height:1.7;background:#eef0da;padding:10px;border-radius:9px">${escapeHtml(p.program.source)}</pre>${p.program.error?'<p class="footer">'+escapeHtml(p.program.error)+'</p>':''}</details>`:'<p class="footer">⌘ 経験を積むと、小さな自作ルーチンが生まれます。</p>';}
function renderFinds(){
 const finds=(state.finds||[]).slice(-4).reverse();
 $('finds').innerHTML=`<h2>✦ 発見の手帳</h2><span class="tag">場所 ${(state.sites||[]).length}</span> <span class="tag">特別な部品 ${(state.resources?.rarePartFinds||[]).length}</span>${finds.length?finds.map(f=>`<div class="find-card"><b>${f.type==='rare-part'?'⚙':'✦'} ${f.name}</b><small>MEHS #${f.finderId}が発見 · 記録 #${f.id}</small></div>`).join(''):'<div class="empty-card"><span class="big">✧</span>まだ見ぬ発見が、<br>どこかで待っています。</div>'}`;
}
function renderPopulation(){
 const a=state.assembly,parts=Number((state.resources?.parts||0).toFixed(1)),retired=Object.values(state.lineage||{}).filter(r=>r.retiredHour!==undefined).sort((a,b)=>b.retiredHour-a.retiredHour).slice(0,6),progress=a?Math.max(0,Math.min(100,(state.hour-a.startedHour)/(a.readyHour-a.startedHour)*100)):0;
 $('hud').innerHTML=`<div class="hud-chip">◉ ${state.people.length}<span>機体</span></div><div class="hud-chip">ϟ ${Number(state.food.toFixed(1))}<span>セル</span></div><div class="hud-chip">⚙ ${parts}<span>部品</span></div>`;
 $('population').innerHTML=`<h2>⚒ 継承の工房</h2><div class="factory-stats"><div><b>${state.people.length}</b><small>稼働中の機体</small></div><div><b>${parts}</b><small>集めた部品</small></div></div>${a?`<div class="assembly-hero"><span class="big">⚙</span><small>${a.source==='station'?'継承設備が自動復旧中':`#${a.builderId}が組み立て中`}</small><strong>MEHS #${a.id}</strong><span class="tag">第${a.generation}世代</span><p class="footer">設計元 ${a.parentIds.map(id=>'#'+id).join('・')||'標準設計'}${a.inspiration?`<br>✦ 発見 #${a.inspiration.id}の部品`:''}</p><div class="bar"><i style="width:${progress}%"></i></div><small>${Math.floor(progress)}% · 起動まで約${Math.max(0,Math.ceil((a.readyHour-state.hour)*60))}分</small></div>`:'<div class="empty-card" style="margin-top:15px"><span class="big">⚒</span>次の出会いの準備中。<br>部品とセルが集まると、<br>新しい機体の組み立てが始まります。</div>'}${retired.length?'<div class="section-label">LEGACY / 残された設計</div>'+retired.map(r=>`<p class="footer">◈ MEHS #${r.id} · 第${r.generation}世代<br>　${Math.floor((r.retiredHour-r.activatedHour)/24)}日の稼働を、次の機体へ。</p>`).join(''):''}`;
}
function render(){
 renderPopulation();renderFinds();
 if(!state.people.some(p=>p.id===selectedId))selectedId=state.people[0]?.id;
 $('log').innerHTML=state.logs.map(t=>`<p>${escapeHtml(t)}</p>`).join('');
 if(!state.people.length){$('people').innerHTML='';$('detail').textContent=state.assembly?'機体は現在0機です。継承設備が次のMEHSを組み立てています。':'MEHSはまだいません。';return;}
 $('people').innerHTML=state.people.map(p=>`<button class="person ${selectedId===p.id?'active':''}" onclick="select(${p.id})" aria-pressed="${selectedId===p.id}"><span class="gen">G${p.generation||1}</span>${avatar(p)}<strong>MEHS #${p.id}</strong><span class="mini-action">${p.action}</span></button>`).join('');
 const p=state.people.find(p=>p.id===selectedId);
 $('detail').innerHTML=`<div class="portrait">${avatar(p)}</div><div class="profile-title"><small>GENERATION ${p.generation||1} / 起動から${Math.floor(Math.max(0,state.hour-(p.activatedHour??state.hour))/24)}日</small><h2>MEHS #${p.id}</h2><span class="tag">${p.trait}</span></div><div class="profile-action">${p.action==='組み立てる'?'⚙':'◈'} ${p.action}</div><div class="speech">${escapeHtml(p.reason)}</div>${[['ϟ 充電量',100-p.hunger,''],['♥ コンディション',p.energy,'amber'],['⌁ 通信したさ',p.social,'blue']].map(([label,value,color])=>`<div class="meter-head"><span>${label}</span><span>${Math.round(value)} / 100</span></div><div class="bar"><i class="${color}" style="width:${value}%"></i></div>`).join('')}<div class="experience"><div><b>${p.success}</b><small>⚙ 回収</small></div><div><b>${p.discoveries}</b><small>✦ 探索</small></div><div><b>${p.kindness}</b><small>⌁ 通信</small></div></div>${programCard(p)}<details class="details"><summary>◈ 設計と摩耗の記録</summary><p>継承元：${p.parentIds?.length?p.parentIds.map(id=>'#'+id).join('・'):'初期設計'}<br>経年耐久 ${Math.round(p.durability??100)} / 100<br>累積摩耗 ${Number((p.wearHours??0).toFixed(1))}時間相当<br>雨による追加 ${Number((p.rainWearHours??0).toFixed(1))}時間<br>仕様：${p.variant||'継承設計'}${p.inspiration?`<br>✦ 発見 #${p.inspiration.id}（#${p.inspiration.finderId}）を継承`:''}</p>${p.scores?.length?'<div class="section-label">行動前の優先度</div>':''}${(p.scores||[]).slice(0,3).map(c=>`<div class="scores"><span>${actions[c.a]}</span><b>${Math.max(0,Math.round(c.s))}</b></div>`).join('')}</details>`;
}

 ctx.strokeStyle='#806f52';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(392,549);ctx.lineTo(519,549);ctx.moveTo(392,586);ctx.lineTo(519,586);ctx.stroke();

 ctx.strokeStyle='#d7ead1';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(525,320);ctx.quadraticCurveTo(515,303,507,329);ctx.moveTo(525,320);ctx.quadraticCurveTo(535,303,544,329);ctx.stroke();

 // Salvage crates under the trees.
 for(const [x,y]of [[787,270],[822,276],[805,247]]){ellipse(x+2,y+15,16,5,'#657a4c20');ctx.fillStyle='#bc9c67';ctx.fillRect(x-12,y-5,24,20);ctx.strokeStyle='#e0c38b';ctx.lineWidth=2;ctx.strokeRect(x-12,y-5,24,20);ctx.beginPath();ctx.moveTo(x-11,y-3);ctx.lineTo(x+10,y+13);ctx.stroke();ctx.fillStyle='#a3ce9c';ctx.fillRect(x-5,y-1,10,7);}

function robot(p,t,i){
 const moving=Math.hypot(p.tx-p.x,p.ty-p.y)>5,bob=moving?Math.sin(t/130+i)*2:Math.sin(t/650+i)*.8,x=p.x,y=p.y+bob;
 ellipse(x,p.y+16,19,6,'#51634b25');
 if(selectedId===p.id){ctx.strokeStyle='#f8dfa3';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,p.y+15,25,11,0,0,7);ctx.stroke();}
 ctx.fillStyle='#40534e';ctx.beginPath();ctx.roundRect(x-17,y+5,34,12,6);ctx.fill();
 ctx.fillStyle=p.color;ctx.beginPath();ctx.roundRect(x-18,y-17,36,30,8);ctx.fill();

 if(p.eyeShape==='visor'){ctx.fillRect(x-12,y-31,24,blink?2:5);}
 else if(p.eyeShape==='round'&&!blink){ellipse(x-8,y-29,4,4,'#8cf0d1');ellipse(x+8,y-29,4,4,'#8cf0d1');}
 else{ctx.fillRect(x-11,y-32,6,blink?2:5);ctx.fillRect(x+5,y-32,6,blink?2:5);}
 if(p.lastEvent&&p.lastEvent.untilHour>state.hour){ctx.fillStyle='#bd9345';ctx.font='bold 14px system-ui';ctx.fillText('✦',x+30,y-44);}
 ctx.strokeStyle='#688e7c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y-43);ctx.lineTo(x,y-52);ctx.stroke();ellipse(x,y-54,4,4,'#8cf0d1');
 ctx.fillStyle='#344c45';ctx.fillRect(x-24,y-12,5,15);ctx.fillRect(x+19,y-12,5,15);
 ctx.fillStyle='#eff8ec';ctx.font='bold 11px system-ui';ctx.fillText('M',x,y+4);
 ctx.fillStyle='#344537';ctx.font='bold 12px system-ui';ctx.fillText(selectedId===p.id?`MEHS #${p.id}`:`#${p.id}`,x,y-65);if(selectedId===p.id){ctx.font='11px system-ui';ctx.fillText(p.action,x,y+34);}if((p.durability??100)<20){ctx.fillStyle='#bc8150';ctx.font='12px system-ui';ctx.fillText('経年劣化',x,y+49);}
}
function draw(timestamp){const elapsed=last===null||document.hidden?0:Math.max(0,(timestamp-last)/1000);last=timestamp;const dt=Math.min(elapsed,.1);if(!document.hidden){animationTime+=dt*1000;if(timestamp-lastUi>=1000){lastUi=timestamp;refresh();}}const t=animationTime;landscape(t);
if(state?.sites?.length){ctx.fillStyle='#8b7842';ctx.font='12px system-ui';ctx.fillText(`✦ 発見した場所 ${state.sites.length}`,760,565);}
if(state?.assembly){ctx.fillStyle='#d5a34c';ctx.font='bold 14px system-ui';ctx.fillText(`⚙ #${state.assembly.id} 組み立て中`,235,485);}
if(state)state.people.forEach((person,i)=>{const v=motion(person,i,dt,t);robot({...person,...v},t,i)});
const h=state?state.hour%24:12;if(h>=20||h<6){ctx.fillStyle='#243d5929';ctx.fillRect(0,0,1000,660)}if(state&&state.rain){ctx.strokeStyle='#6e94a966';ctx.lineWidth=2;for(let i=0;i<65;i++){let x=(i*59+t/15)%1000,y=(i*83+t/3)%660;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-6,y+16);ctx.stroke()}}requestAnimationFrame(draw)}
$('live').onclick=()=>{selectedAt=null;visuals.clear();lastState=null;refresh();};
$('seek').oninput=()=>{if(!timeline)return;const now=Date.now(),value=Number($('seek').value);selectedAt=value>=120?null:Math.max(Date.parse(timeline.windowStart),now-(120-value)*60000);visuals.clear();lastState=null;refresh();};
canvas.onclick=e=>{if(!state)return;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*1000/r.width,y=(e.clientY-r.top)*660/r.height;let i=state.people.findIndex(p=>{const v=visuals.get(p.id);return v&&Math.hypot(v.x-x,v.y-y)<40});if(i>=0)select(state.people[i].id)};
document.addEventListener('visibilitychange',()=>{last=null;if(!document.hidden){refresh();loadState();}});
loadState();setInterval(()=>{if(!document.hidden)loadState()},60000);requestAnimationFrame(draw);

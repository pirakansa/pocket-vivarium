name: Update village and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # Every two hours at :17 UTC (01:17, 03:17, ... 23:17 JST).
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      update_state:
        description: 'Advance the village to the current two-hour execution slot'
        type: boolean
        default: false

permissions:
  contents: read

# Keep generation, persistence and publication in order.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Migrate resident identities
        run: node scripts/migrate-identities.cjs

      - name: Migrate MEHS vocabulary
        run: node scripts/migrate-mehs.cjs

      - name: Migrate lifecycle metadata
        run: node scripts/migrate-lifecycle.cjs

      - name: Test weather and wear
        run: node tests/weather.cjs

      - name: Test spatial movement and local communication
        run: node tests/movement.cjs

      - name: Test prolonged power shortage wear
        run: node tests/power-wear.cjs

      - name: Test reproducible randomness
        run: node tests/random.cjs

      - name: Test lifecycle
        run: node tests/lifecycle.cjs

      - name: Test MEHS migration
        run: node tests/mehs.cjs

      - name: Test resident identities
        run: node tests/identities.cjs

      - name: Test incidents and learned recovery skills
        run: node tests/incidents.cjs

      - name: Test executable programs
        run: node tests/programs.cjs

      - name: Test changing daily event contracts
        run: node tests/event-contract.cjs

      - name: Test misleading information and visitor behavior
        run: node tests/misinformation.cjs

      - name: Test AI resident routines
        run: node tests/ai-routines.cjs

      - name: Load disposable external plugin
        env:
          GH_TOKEN: ${{ github.token }}
          EXTERNAL_PLUGIN_PATH: ${{ runner.temp }}/external-plugin.json
        run: node scripts/fetch-external-plugin.cjs

      - name: Generate records or migrate legacy format
        env:
          EXTERNAL_PLUGIN_PATH: ${{ runner.temp }}/external-plugin.json
          UPDATE_STATE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.update_state) }}
        run: |
          if [ "$UPDATE_STATE" = "true" ] || node -e "process.exit(require('./dist/state.json').schemaVersion === 3 ? 1 : 0)"; then
            node scripts/update-state.cjs
          fi

      - name: Remove disposable source
        if: always()
        env:
          EXTERNAL_PLUGIN_PATH: ${{ runner.temp }}/external-plugin.json
        run: node -e "require('node:fs').rmSync(process.env.EXTERNAL_PLUGIN_PATH, {force:true})"

      - name: Test state generator
        run: node tests/update-state.cjs

      - name: Test live viewer
        run: node tests/player.cjs

      - name: Test history summary
        run: node tests/history.cjs

      - name: Commit generated records
        run: |
          git add dist/state.json
          if [ -d data/history ]; then git add data/history; fi
          if git diff --cached --quiet; then
            echo 'No new records to persist.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update village state records'
          git push origin HEAD:main

      - name: Build history summary
        run: node scripts/build-history.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

